name: SQIsign v3 symmetric profiles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [BASELINE, STREEBOG_HASH, RUSSIAN_PRNG, COMBINED]
        mode: [Release, San]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nettle-dev libgcrypt20 ninja-build
      - run: bash research/build.sh "${{ matrix.profile }}" "${{ matrix.mode }}"
      - name: Record environment and test inventory
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          { cc --version; cmake --version; pkg-config --modversion nettle; uname -srmo; } > evidence/environment.txt
          ctest --test-dir build-${{ matrix.profile }}-${{ matrix.mode }} --show-only=json-v1 > evidence/registered.json
      - if: matrix.mode == 'San'
        run: bash research/lsan-probe.sh | tee evidence/lsan.txt
        shell: bash
      - run: bash research/verify.sh "${{ matrix.profile }}" "${{ matrix.mode }}" | tee evidence/tests.txt
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.profile }}-${{ matrix.mode }}
          path: evidence/
      - if: matrix.mode == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: drivers-${{ matrix.profile }}
          path: build-${{ matrix.profile }}-Release/research/trial_*
  compatibility:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: drivers-*
          path: drivers
      - run: |
          for profile in BASELINE STREEBOG_HASH RUSSIAN_PRNG COMBINED; do
            dir="build-$profile-Release/research"
            mkdir -p "$dir"
            cp "drivers/drivers-$profile"/trial_* "$dir"/
            chmod +x "$dir"/trial_*
          done
          python3 research/check.py
